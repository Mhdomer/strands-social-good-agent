[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nafas"
version = "0.1.0"
description = "Nafas (نَفَس): Climate-Respiratory and Heat Stress AI Guardian for AWS Strands SDK Hackathon"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Mohamed Makhlouf", email = "muhamedomar.g@gmail.com" }
]
dependencies = [
    "strands-agents>=1.60.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nafas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_default_fixture_loop_scope = "function"
